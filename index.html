<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1558b0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="人生をAIと共に設計・分析・成長させる人生OS">
  <title>Life Compass AI OS</title>
  <link rel="manifest" href="manifest.webmanifest?v=2.1.3">
  <link rel="stylesheet" href="styles.css?v=2.1.3">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="Life Compass AI OS ホーム">
        <span class="brand-mark">LC</span><span><b>Life Compass</b><small>AI OS</small></span>
      </a>
      <nav id="nav" aria-label="メインメニュー"></nav>
      <div class="sidebar-bottom">
        <button class="nav-link" data-action="sync"><span>↻</span><span>同期する</span><i id="syncDot"></i></button>
        <button class="nav-link" data-page="settings"><span>⚙</span><span>設定</span></button>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="メニューを閉じる"></button>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuButton" aria-label="メニューを開く" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div><p class="eyebrow" id="todayLabel"></p><h1 id="pageTitle">今日のコンパス</h1></div>
        <div class="top-actions">
          <button class="search-trigger" data-page="search" aria-label="データを検索"><span>⌕</span><span>検索</span></button>
          <span class="connection-pill" id="connectionPill"><i></i><span>端末保存</span></span>
          <span class="save-state" id="saveState">この端末に保存済み</span>
          <button class="icon-btn subtle" id="installButton" data-action="install-app" aria-label="アプリをインストール" hidden>↓</button>
          <button class="avatar" data-page="profile" aria-label="プロフィール"><span id="avatarText">相</span></button>
        </div>
      </header>
      <section id="app" class="page" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav" id="mobileNav" aria-label="モバイルメニュー"></nav>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <dialog id="recordDialog" class="modal"></dialog>
  <dialog id="migrationDialog" class="modal modal-wide"></dialog>
  <dialog id="detailDialog" class="modal modal-wide"></dialog>
  <input type="file" id="jsonFile" accept="application/json,.json" multiple hidden>
  <script type="module" src="src/app.js?v=2.1.3"></script>
</body>
</html>
